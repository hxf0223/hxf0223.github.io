  </style> <div class="post"> <header class="post-header"> <h1 class="post-title">搜索</h1> <p class="post-description">搜索站内文章标题、标签、分类和全文内容</p> </header> <article> <div id="search-input-wrapper"> <span id="search-input-icon"> <i class="fa-solid fa-magnifying-glass"></i> </span> <input type="search" id="search-input" placeholder="输入关键词搜索文章标题、标签或正文内容…" autocomplete="off" autofocus=""> <button id="search-clear-btn" type="button" title="清空输入" aria-label="清空"> <i class="fa-solid fa-xmark"></i> </button> </div> <div id="search-status"> <i class="fa-solid fa-spinner fa-spin"></i> 正在加载站内全文索引库，请稍候… </div> <div id="search-results"></div> <script>
  (function () {
    var input = document.getElementById("search-input");
    var clearBtn = document.getElementById("search-clear-btn");
    var status = document.getElementById("search-status");
    var results = document.getElementById("search-results");

    var searchIndex = null;
    var isLoadingIndex = true;
    var searchTimer = null;

    // Load search.json asynchronously
    var indexUrl = "/assets/js/data/search.json";

    fetch(indexUrl)
      .then(function (res) {
        if (!res.ok) throw new Error("Network response was not ok");
        return res.json();
      })
      .then(function (data) {
        searchIndex = data;
        isLoadingIndex = false;
        var postCount = data.length || 0;
        status.innerHTML =
          '<i class="fa-solid fa-circle-check text-success"></i> 索引库已加载（共 ' +
          postCount +
          " 篇博文），请输入关键词开始全文检索";

        // Check if there's query param in URL ?q=...
        var urlParams = new URLSearchParams(window.location.search);
        var qParam = urlParams.get("q") || urlParams.get("s");
        if (qParam) {
          input.value = qParam;
          triggerSearch();
        }
      })
      .catch(function (err) {
        isLoadingIndex = false;
        console.error("Failed to load search index:", err);
        status.innerHTML =
          '<i class="fa-solid fa-triangle-exclamation text-danger"></i> 索引库加载失败，请刷新重试';
      });

    function escapeHtml(str) {
      if (!str) return "";
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function createSnippet(content, terms) {
      if (!content) return "";
      var plainText = content.replace(/<[^>]*>/g, "").replace(/\s+/g, " ");

      // Find first occurrence of any term
      var firstIdx = -1;
      var matchedTerm = "";
      for (var i = 0; i < terms.length; i++) {
        var idx = plainText.toLowerCase().indexOf(terms[i].toLowerCase());
        if (idx > -1 && (firstIdx === -1 || idx < firstIdx)) {
          firstIdx = idx;
          matchedTerm = terms[i];
        }
      }

      var start = Math.max(0, firstIdx - 50);
      var end = Math.min(plainText.length, firstIdx + 120);
      var snippet =
        (start > 0 ? "..." : "") +
        plainText.substring(start, end) +
        (end < plainText.length ? "..." : "");

      // Highlight all terms
      terms.forEach(function (term) {
        if (!term) return;
        var safeTerm = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        var regex = new RegExp("(" + safeTerm + ")", "gi");
        snippet = snippet.replace(regex, "<mark>$1</mark>");
      });

      return snippet;
    }

    function highlightTitle(title, terms) {
      var safeTitle = escapeHtml(title);
      terms.forEach(function (term) {
        if (!term) return;
        var safeTerm = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        var regex = new RegExp("(" + safeTerm + ")", "gi");
        safeTitle = safeTitle.replace(regex, "<mark>$1</mark>");
      });
      return safeTitle;
    }

    function performSearch(query) {
      if (!searchIndex) return;

      var trimmed = query.trim();
      if (!trimmed) {
        status.innerHTML =
          '<i class="fa-solid fa-circle-check text-success"></i> 索引库已就绪（共 ' +
          searchIndex.length +
          " 篇博文），请输入关键词搜索";
        results.innerHTML = "";
        clearBtn.style.display = "none";
        return;
      }

      clearBtn.style.display = "block";
      var terms = trimmed.split(/\s+/).filter(Boolean);

      var matchedPosts = [];
      for (var i = 0; i < searchIndex.length; i++) {
        var post = searchIndex[i];
        var title = post.title || "";
        var categories = post.categories || "";
        var tags = post.tags || "";
        var content = post.content || "";

        var fullSearchString = (
          title +
          " " +
          categories +
          " " +
          tags +
          " " +
          content
        ).toLowerCase();

        // AND search: all terms must match
        var allMatch = true;
        for (var j = 0; j < terms.length; j++) {
          if (fullSearchString.indexOf(terms[j].toLowerCase()) === -1) {
            allMatch = false;
            break;
          }
        }

        if (allMatch) {
          matchedPosts.push(post);
        }
      }

      if (matchedPosts.length === 0) {
        status.innerHTML =
          '<i class="fa-solid fa-circle-exclamation text-warning"></i> 未找到与 “<strong>' +
          escapeHtml(trimmed) +
          "</strong>” 相关的文章，请尝试更换关键词";
        results.innerHTML = "";
      } else {
        status.innerHTML =
          '<i class="fa-solid fa-magnifying-glass"></i> 找到 <strong>' +
          matchedPosts.length +
          "</strong> 篇与 “<strong>" +
          escapeHtml(trimmed) +
          "</strong>” 相关的文章";

        var html = "";
        for (var k = 0; k < matchedPosts.length; k++) {
          var p = matchedPosts[k];
          var snippet = createSnippet(p.content, terms);
          var hTitle = highlightTitle(p.title, terms);

          html += "<article>";
          html += '<h2><a href="' + p.url + '">' + hTitle + "</a></h2>";
          html += '<div class="search-meta">';
          if (p.date) {
            html +=
              '<span><i class="fa-solid fa-calendar fa-xs"></i> ' +
              escapeHtml(p.date) +
              "</span>";
          }
          if (p.categories) {
            html +=
              '<span><i class="fa-solid fa-tag fa-xs"></i> ' +
              escapeHtml(p.categories) +
              "</span>";
          }
          if (p.tags) {
            html +=
              '<span><i class="fa-solid fa-hashtag fa-xs"></i> ' +
              escapeHtml(p.tags) +
              "</span>";
          }
          html += "</div>";
          if (snippet) {
            html += '<p class="search-snippet">' + snippet + "</p>";
          }
          html += "</article>";
        }
        results.innerHTML = html;
      }
    }

    function triggerSearch() {
      var q = input.value;
      if (isLoadingIndex) {
        status.innerHTML =
          '<i class="fa-solid fa-spinner fa-spin"></i> 正在加载索引库并准备检索 “<strong>' +
          escapeHtml(q) +
          "</strong>”…";
        return;
      }

      if (q.trim().length > 0) {
        status.innerHTML =
          '<i class="fa-solid fa-spinner fa-spin"></i> 正在检索 “<strong>' +
          escapeHtml(q.trim()) +
          "</strong>”…";
      }

      if (searchTimer) clearTimeout(searchTimer);
      searchTimer = setTimeout(function () {
        performSearch(q);
      }, 100);
    }

    input.addEventListener("input", triggerSearch);

    clearBtn.addEventListener("click", function () {
      input.value = "";
      input.focus();
      triggerSearch();
    });
  })();
</script> </article> </div> </div> <footer class="fixed-bottom" role="contentinfo"> <div class="container mt-0"> © Copyright 2026 Roderick Huang. Powered by <a href="https://jekyllrb.com/" target="_blank" rel="external nofollow noopener">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio" rel="external nofollow noopener" target="_blank">al-folio</a> theme. Hosted by <a href="https://pages.github.com/" target="_blank" rel="external nofollow noopener">GitHub Pages</a>. Photos from <a href="https://unsplash.com" target="_blank" rel="external nofollow noopener">Unsplash</a>. </div> </footer> <script>
